# Exposes the Looka API's Swagger UI on its own port (no password — restrict who
# can reach the port with the firewall; the API's own guards still protect /v1).
#
#   http://<host>:8088/docs        Swagger UI
#   http://<host>:8088/docs-json   raw OpenAPI document (JSON)
#   http://<host>:8088/docs-yaml   raw OpenAPI document (YAML)
#
#   http://<host>:8088/v1/...      the real API, so Swagger UI's "Try it out" works
#
# Every other path is a 404. To publish docs only, delete the `location /v1/`
# block (Try it out then stops working).
#
# Paths below (mime.types, logs/) are relative to nginx's prefix, so this file
# works unchanged as <nginx-dir>/conf/nginx.conf on Windows and as
# /etc/nginx/nginx.conf on Linux (adjust `error_log`/`pid`/`access_log` there).

worker_processes  1;
error_log         logs/error.log warn;
pid               logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/access.log;
    sendfile      on;
    server_tokens off;

    # Any API process serves Swagger (SwaggerModule.setup in apps/api/src/main.ts
    # runs for every SERVICE_TYPE), so point this at whichever one is handy.
    upstream looka_api {
        server 127.0.0.1:3100;
        keepalive 8;
    }

    server {
        listen       8088;
        server_name  _;

        # Match the API's own 25mb JSON body limit (apps/api/src/main.ts) —
        # nginx's 1m default would 413 photo/xlsx/asset uploads sent from
        # Swagger UI long before they reach the API.
        client_max_body_size 30m;

        # Shared by every proxied location below.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        location = / {
            return 302 /docs;
        }

        # /docs, /docs/<static asset>, /docs-json, /docs-yaml.
        location ~ ^/docs(-json|-yaml)?(/|$) {
            proxy_pass http://looka_api;

            # The API's helmet() sends `upgrade-insecure-requests` (and HSTS).
            # Opened over plain http from a LAN IP (browsers exempt localhost),
            # that makes the browser re-request Swagger's CSS/JS as https://,
            # which this http-only port cannot answer -> blank page. Re-send
            # helmet's exact policy minus that one directive.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Strict-Transport-Security;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' https: data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https: 'unsafe-inline'" always;
        }

        # The API itself (every operation in the OpenAPI document is under /v1).
        location /v1/ {
            proxy_pass http://looka_api;
        }

        location / {
            return 404;
        }
    }
}
